<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" width="480" height="620" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eef2f8"/>
      <stop offset="100%" stop-color="#dbe3ef"/>
    </linearGradient>
    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#3a465e" flood-opacity="0.22"/>
    </filter>
    <filter id="blurBlob" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="480" height="620" fill="url(#bgGrad)"/>
  <circle cx="90" cy="120" r="130" fill="#ffffff" opacity="0.7" filter="url(#blurBlob)"/>
  <circle cx="410" cy="480" r="120" fill="#c8d5e8" opacity="0.5" filter="url(#blurBlob)"/>

  <g id="header">
    <text x="28" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#4a5568">Memory Sequence</text>
    <text x="230" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#6b7688">Play</text>
    <text x="336" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#6b7688">Leaderboard</text>
    <rect x="378" y="22" width="52" height="30" rx="15" fill="#ffffff" opacity="0.85"/>
    <text x="402" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#3d4759">About</text>
    <g transform="translate(443,34) scale(1.1)" fill="#6b7688">
      <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </g>
  </g>

  <text x="70" y="120" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#3d4759">About Memory Sequence</text>
  <text x="70" y="152" font-family="system-ui, sans-serif" font-size="14" fill="#6b7688">A small memory game — nine glass keys, each with its own</text>
  <text x="70" y="172" font-family="system-ui, sans-serif" font-size="14" fill="#6b7688">note and color. Watch the sequence, then play it back.</text>

  <text x="70" y="222" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#3d4759">How to play</text>

  <g id="step-1">
    <circle cx="76" cy="250" r="10" fill="#eef2f8"/>
    <text x="76" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#3d4759">1</text>
    <text x="96" y="254" font-family="system-ui, sans-serif" font-size="14" fill="#4a5568">Press Play to hear and see the first note in the sequence</text>
  </g>

  <g id="step-2">
    <circle cx="76" cy="286" r="10" fill="#eef2f8"/>
    <text x="76" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#3d4759">2</text>
    <text x="96" y="290" font-family="system-ui, sans-serif" font-size="14" fill="#4a5568">Repeat the sequence by clicking the same keys in order</text>
  </g>

  <g id="step-3">
    <circle cx="76" cy="322" r="10" fill="#eef2f8"/>
    <text x="76" y="326" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#3d4759">3</text>
    <text x="96" y="326" font-family="system-ui, sans-serif" font-size="14" fill="#4a5568">Each round adds one more note to remember</text>
  </g>

  <g id="step-4">
    <circle cx="76" cy="358" r="10" fill="#eef2f8"/>
    <text x="76" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#3d4759">4</text>
    <text x="96" y="362" font-family="system-ui, sans-serif" font-size="14" fill="#4a5568">Miss a note and your run ends — try to beat your best</text>
  </g>

  <g id="github-footer">
    <rect x="40" y="420" width="400" height="60" rx="20" fill="#ffffff" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.55" filter="url(#softShadow)"/>
    <g transform="translate(66,438) scale(1.35)" fill="#4a5568">
      <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </g>
    <text x="98" y="456" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#3d4759">View source on GitHub</text>
    <text x="98" y="474" font-family="system-ui, sans-serif" font-size="12" fill="#6b7688">Open source — contributions welcome</text>
  </g>
</svg>
