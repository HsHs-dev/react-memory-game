<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 700" width="480" height="700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eef2f8"/>
      <stop offset="100%" stop-color="#dbe3ef"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3ba" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#67768f" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e2e9f4" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#3a465e" flood-opacity="0.32"/>
    </filter>
    <filter id="blurBlob" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="480" height="700" fill="url(#bgGrad)"/>
  <circle cx="90" cy="150" r="140" fill="#ffffff" opacity="0.75" filter="url(#blurBlob)"/>
  <circle cx="410" cy="470" r="130" fill="#c8d5e8" opacity="0.55" filter="url(#blurBlob)"/>

  <g id="header">
